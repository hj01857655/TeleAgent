services:
  teleagent2api:
    build: .
    container_name: teleagent2api
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - TELEAGENT_TOKEN=${TELEAGENT_TOKEN:-}
      - TELEAGENT_INSTALL_ID=${TELEAGENT_INSTALL_ID:-}
      - TELEAGENT_DEVICE_ID=${TELEAGENT_DEVICE_ID:-}
      - API_KEY=${API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TELEAGENT_KEYS_FILE=${TELEAGENT_KEYS_FILE:-/app/data/teleagent-keys.json}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - TELEAGENT_ROUTE_TARGET=${TELEAGENT_ROUTE_TARGET:-ops-gateway}
      - TELEAGENT_APP_VERSION=${TELEAGENT_APP_VERSION:-2.7.0}
      - TELEAGENT_MODELS=${TELEAGENT_MODELS:-chat-nano,chat-lite,chat-pro,chat-flash}
      - TELEAGENT_TIMEOUT=${TELEAGENT_TIMEOUT:-120s}
      - TELEAGENT_LOG_LEVEL=${TELEAGENT_LOG_LEVEL:-info}
      - TELEAGENT_LOG_FORMAT=${TELEAGENT_LOG_FORMAT:-text}
      - TELEAGENT_RETRY_COUNT=${TELEAGENT_RETRY_COUNT:-0}
      - TELEAGENT_SIGN=${TELEAGENT_SIGN:-0}
      # Auto check-in (TeleAgent Star Welfare Club / 积分福利社)
      - CHECKIN_ENABLED=${CHECKIN_ENABLED:-0}
      - CHECKIN_TIME=${CHECKIN_TIME:-08:00}
      - CHECKIN_TYPE=${CHECKIN_TYPE:-daily_login}
      - TELEAGENT_USER_ID=${TELEAGENT_USER_ID:-}
      # Upstream egress proxy (Resin-style proxy pool gateway)
      - TELEAGENT_PROXY=${TELEAGENT_PROXY:-}
      - TELEAGENT_PROXY_PLATFORM=${TELEAGENT_PROXY_PLATFORM:-}
      - TELEAGENT_PROXY_ACCOUNT=${TELEAGENT_PROXY_ACCOUNT:-}
      - TELEAGENT_PROXY_TOKEN=${TELEAGENT_PROXY_TOKEN:-}
      # Web-login token renewal
      - TELEAGENT_STATE_FILE=${TELEAGENT_STATE_FILE:-/app/data/token-state.json}
      - TELEAGENT_PUBLIC_URL=${TELEAGENT_PUBLIC_URL:-}
    volumes:
      # Persists credentials renewed through the web panel (/ui → 网页登录续期)
      - ./data:/app/data
      # Optional: Mount config.json if you prefer file-based config over env vars
      # - ./config.json:/app/config.json:ro
    networks:
      - teleagent_net

networks:
  teleagent_net:
    driver: bridge
